                    </div>
                    
                    <!-- Input Footer -->
                    <div class="p-4 bg-white border-t border-gray-100">
                      <form onSubmit=${(e) => { e.preventDefault(); handleSend(); }} class="flex gap-2">
                        <input 
                          type="text" 
                          value=${input} 
                          onInput=${e => setInput(e.target.value)} 
                          placeholder="Consulte a nuestro asistente..." 
                          class="flex-grow bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1FB4FA]/50 focus:border-[#1FB4FA] text-sm text-[#065581] placeholder-gray-400 transition-all" 
                        />
                        <button 
                          type="submit" 
                          disabled=${isLoading || !input.trim()} 
                          class="bg-[#065581] text-white p-3 rounded-xl hover:bg-[#1FB4FA] transition-colors disabled:opacity-50 disabled:hover:bg-[#065581] shadow-md"
                        >
                          <${Send} size=${20} class="${!isLoading && input.trim() ? 'translate-x-0.5 -translate-y-0.5 transition-transform' : ''}" />
                        </button>
                      </form>
                    </div>
                 </div>
              ` : ''}
            </div>
          `;
        };

        const App = () => {
          const [activeTab, setActiveTab] = useState('nosotros');
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);

          useEffect(() => {
            const handleUrlRouting = () => {
              const params = new URLSearchParams(window.location.search);
              const tabParam = params.get('tab');
              const hash = window.location.hash;
              if (tabParam === 'privacidad' || hash === '#privacidad') {
                setActiveTab('privacidad');
                window.scrollTo(0,0);
              }
            };
            handleUrlRouting();
            window.addEventListener('hashchange', handleUrlRouting);
            return () => window.removeEventListener('hashchange', handleUrlRouting);
          }, []);

          useEffect(() => {
            const handleScroll = () => setScrolled(window.scrollY > 20);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const tabs = [
            { id: 'nosotros', label: 'Nosotros' },
            { id: 'productos', label: 'Productos Clínicos' },
            { id: 'servicios', label: 'Otros Servicios' },
            { id: 'contacto', label: 'Contáctanos' }
          ];

          return html`
            <div class="min-h-screen bg-[#FDFDFD] font-sans selection:bg-[#065581] selection:text-white flex flex-col">

              <!-- NAVBAR -->
              <nav class="fixed w-full z-50 transition-all duration-300 ${scrolled ? 'glass-panel shadow-sm py-3' : 'bg-transparent py-5'}">
                <div class="max-w-7xl mx-auto px-6">
                  <div class="flex justify-between items-center">
                    
                    <!-- Logo -->
                    <div 
                      class="flex items-center cursor-pointer"
                      onClick=${() => { setActiveTab('nosotros'); window.location.hash = ''; window.scrollTo(0,0); }}
                    >
                      <img 
                        src="https://raw.githubusercontent.com/alexzanderj14/Vonces-y-memorias-de-Zambiza/main/Versior.png" 
                        alt="VERSIOR IMPORT'S Logo" 
                        class="h-12 md:h-14 w-auto object-contain drop-shadow-sm hover:scale-105 transition-transform duration-300"
                      />
                    </div>

                    <!-- Desktop Navigation -->
                    <div class="hidden md:flex items-center space-x-2 bg-white/60 backdrop-blur-md px-2 py-1.5 rounded-full border border-gray-200/50 shadow-sm">
                      ${tabs.map((tab) => html`
                        <button
                          key=${tab.id}
                          onClick=${() => {setActiveTab(tab.id); window.location.hash = ''; window.scrollTo(0,0);}}
                          class="px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 ${
                            activeTab === tab.id 
                              ? 'bg-[#1FB4FA] text-white shadow-md' 
                              : 'text-gray-500 hover:text-[#1FB4FA] hover:bg-gray-100/50'
                          }"
                        >
                          ${tab.label}
                        </button>
                      `)}
                    </div>

                    <!-- Social Desktop -->
                    <div class="hidden md:flex items-center gap-4">
                      <a href="https://www.tiktok.com/@versiorimports?_r=1&_t=ZS-9782m70cxLF" target="_blank" rel="noopener noreferrer" class="text-[#065581]/70 hover:text-[#1FB4FA] transform hover:-translate-y-2 hover:scale-110 drop-shadow-sm hover:drop-shadow-[0_10px_10px_rgba(31,180,250,0.5)] transition-all duration-300">
                        <${TikTokIcon} size=${24} />
                      </a>
                      <a href="https://www.facebook.com/share/1BNhBNCfNU/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="text-[#065581]/70 hover:text-[#1FB4FA] transform hover:-translate-y-2 hover:scale-110 drop-shadow-sm hover:drop-shadow-[0_10px_10px_rgba(31,180,250,0.5)] transition-all duration-300">
                        <${Facebook} size=${24} />
                      </a>
                      <a href="https://www.instagram.com/versiorimports/" target="_blank" rel="noopener noreferrer" class="text-[#065581]/70 hover:text-[#1FB4FA] transform hover:-translate-y-2 hover:scale-110 drop-shadow-sm hover:drop-shadow-[0_10px_10px_rgba(31,180,250,0.5)] transition-all duration-300">
                        <${Instagram} size=${24} />
                      </a>
                      <a href="https://www.linkedin.com/company/versior-imports" target="_blank" rel="noopener noreferrer" class="text-[#065581]/70 hover:text-[#1FB4FA] transform hover:-translate-y-2 hover:scale-110 drop-shadow-sm hover:drop-shadow-[0_10px_10px_rgba(31,180,250,0.5)] transition-all duration-300">
                        <${Linkedin} size=${24} />
                      </a>
                    </div>

                    <!-- Mobile Menu Toggle -->
                    <button 
                      class="md:hidden text-[#1FB4FA] p-2"
                      onClick=${() => setIsMenuOpen(!isMenuOpen)}
                    >
                      ${isMenuOpen ? html`<${X} size=${28} />` : html`<${Menu} size=${28} />`}
                    </button>
                  </div>
                </div>

                <!-- Mobile Navigation Dropdown -->
                ${isMenuOpen ? html`
                  <div class="md:hidden absolute top-full left-0 w-full bg-white border-t border-gray-100 shadow-xl animate-fade-in">
                    <div class="flex flex-col p-4 space-y-2">
                      ${tabs.map((tab) => html`
                        <button
                          key=${tab.id}
                          onClick=${() => {
                            setActiveTab(tab.id);
                            setIsMenuOpen(false);
                            window.location.hash = '';
                            window.scrollTo(0,0);
                          }}
                          class="p-4 rounded-xl text-left font-bold transition-colors ${
                            activeTab === tab.id ? 'bg-[#f0f9ff] text-[#1FB4FA]' : 'text-gray-600 hover:bg-gray-50'
                          }"
                        >
                          ${tab.label}
                        </button>
                      `)}
                    </div>
                  </div>
                ` : ''}
              </nav>

              <!-- MAIN CONTENT AREA -->
              <main class="flex-grow pt-20">
                ${activeTab === 'nosotros' ? html`<${NosotrosView} setActiveTab=${setActiveTab} />` : ''}
                ${activeTab === 'productos' ? html`<${ProductosView} setActiveTab=${setActiveTab} />` : ''}
                ${activeTab === 'servicios' ? html`<${ServiciosView} setActiveTab=${setActiveTab} />` : ''}
                ${activeTab === 'contacto' ? html`<${ContactoView} setActiveTab=${setActiveTab} />` : ''}
                ${activeTab === 'privacidad' ? html`<${PrivacidadView} />` : ''}
              </main>

              <!-- GLOBAL FOOTER -->
              <footer class="bg-[#065581] pt-16 pb-8 border-t-4 border-[#1FB4FA]">
                <div class="max-w-7xl mx-auto px-6">
                  <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-8">
                    
                    <!-- Logotipo e información de Sedes en la parte de abajo -->
                    <div class="flex flex-col items-center md:items-start mb-6 md:mb-0">
                      <div 
                        class="flex items-center bg-white p-3 rounded-2xl shadow-lg cursor-pointer hover:scale-105 transition-transform duration-300 mb-4"
                        onClick=${() => {setActiveTab('nosotros'); window.location.hash = ''; window.scrollTo(0,0);}}
                      >
                        <img 
                          src="https://raw.githubusercontent.com/alexzanderj14/Vonces-y-memorias-de-Zambiza/main/Versior.png" 
                          alt="VERSIOR IMPORT'S Logo" 
                          class="h-10 md:h-12 w-auto object-contain"
                        />
                      </div>
                      <div class="text-white/80 space-y-1 text-center md:text-left text-xs md:text-sm leading-relaxed max-w-md">
                        <p class="flex items-start gap-2 justify-center md:justify-start">
                          <${MapPin} size=${16} class="text-[#1FB4FA] flex-shrink-0 mt-0.5" /> 
                          <span><strong>Quito:</strong> Pichincha, Quito - Calle Giovani Calles y Palermo, urbanización UTE</span>
                        </p>
                        <p class="flex items-start gap-2 justify-center md:justify-start">
                          <${MapPin} size=${16} class="text-[#1FB4FA] flex-shrink-0 mt-0.5" /> 
                          <span><strong>Biblián:</strong> Cañar, Biblián - Av. Mariscal Sucre y Benjamín Ochoa esquina</span>
                        </p>
                      </div>
                    </div>
                    
                    <div class="flex flex-wrap justify-center gap-6 text-sm font-bold text-white/70">
                      <button onClick=${() => {setActiveTab('nosotros'); window.scrollTo(0,0);}} class="hover:text-white transition-colors">Nosotros</button>
                      <a href="https://raw.githubusercontent.com/alexzanderj14/versior/main/Catalogo_Versior.pdf" download="Catalogo_VERSIOR_2026.pdf" class="text-[#1FB4FA] hover:text-white transition-colors flex items-center gap-1"><${Download} size=${16} /> Descargar Catálogo</a>
                      <button onClick=${() => {setActiveTab('servicios'); window.scrollTo(0,0);}} class="hover:text-white transition-colors">Servicios</button>
                      <button onClick=${() => {setActiveTab('contacto'); window.scrollTo(0,0);}} class="hover:text-white transition-colors">Contacto</button>
                    </div>
                  </div>
                  
                  <div class="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center text-xs font-semibold text-white/50">
                    <p>&copy; ${new Date().getFullYear()} VERSIOR IMPORT'S. Todos los derechos reservados.</p>
                    <div class="flex items-center gap-4 mt-2 md:mt-0 text-white/60">
                      <span>Soluciones de vanguardia para la salud visual en Ecuador.</span>
                      <span>|</span>
                      <button 
                        onClick=${() => { setActiveTab('privacidad'); window.location.hash = 'privacidad'; window.scrollTo(0,0); }} 
                        class="text-[#1FB4FA] hover:underline font-bold transition-all"
                      >
                        Política de Privacidad (LOPDP)
                      </button>
                    </div>
                  </div>
                </div>
              </footer>
              
              <${ChatWidget} />
            </div>
          `;
        }

        const root = document.getElementById('root');
        render(html`<${App} />`, root);
    </script>
</body>
</html>
