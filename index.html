      }, [messages]);

      const renderChatMessage = (text) => {
        const regex = /(haz clic aqu[ií] para contactarte directamente 👤 \+593 \d{2} \d{3} \d{4})/gi;
        const parts = text.split(regex);
        
        return parts.map((part, i) => {
          if (part.match(regex)) {
            const number = part.replace(/[^\d+]/g, '');
            return html`
              <a 
                key=${i} 
                href=${`https://wa.me/${number.replace('+', '')}`} 
                target="_blank" 
                rel="noopener noreferrer" 
                onClick=${() => trackEvent('generate_lead', { source: 'chat_assistant', channel: 'whatsapp' })}
                class="font-bold underline cursor-pointer text-gray-900 hover:text-[#065581] transition-colors bg-gray-100 border border-gray-200/50 px-3 py-2 rounded-xl block mt-2 shadow-sm text-center"
              >
                ${part}
              </a>
            `;
          }
          return part;
        });
      };

      const getLocalAIResponse = (userQuery) => {
        const query = userQuery.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        
        if (query.match(/(hola|buenos dias|buenas tardes|buenas noches|saludos|que tal|asistente)/)) {
          return "Hola, un saludo cordial de parte del equipo de VERSIOR IMPORT'S. Estoy aquí para resolver todas sus dudas sobre equipamiento clínico de salud visual, garantías y diseño de ópticas. ¿Sobre qué equipo o servicio le gustaría recibir asesoría hoy?";
        }
        if (query.match(/(7610|ark7610|ark-7610|autorrefractometro queratometro|refractometro)/)) {
          return "El Autorrefractómetro / Queratómetro ARK-7610 incorpora tecnología de imagen de Hartmann, pantalla táctil LCD ajustable y medición en pupilas de hasta 2.0 mm. Para consultar disponibilidad, promociones y cotización con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(600|rmk|rmk600|rmk-600|autotracking|automatizado)/)) {
          return "El RK-600 es nuestro Autorrefractómetro avanzado con sistema de Autotracking inteligente y mentonera robótica. Mide en menos de 0.5 s, ideal para un alto flujo de pacientes. Para cotizaciones con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(lm-260|lm260|lensometro|lensometria)/)) {
          return "El Lensómetro Digital LM-260 incorpora cámara de alta resolución Hartmann y medición de transmitancia UV integrada (UV400-UVA). Para cotizar con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(vc-235|vc235|optotipo|pantalla|daltonismo|ambliopia)/)) {
          return "La Pantalla Optotipo VC-235 posee una pantalla LED/LCD de 23.5\" HD calibrable de 2.0m a 6.5m. Para cotizar con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(ls-4|ls4|lampara|hendidura|tonometro|biomicroscopia)/)) {
          return "La Lámpara de Hendidura LS-4 ofrece óptica premium con magnificación de 5 pasos e iluminación LED luz fría. Para cotizar con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(c-190|c190|unidad|unidad de diagnostico|sillon|foroptero)/)) {
          return "La Unidad de Diagnóstico C-190A es el centro ergonómico definitivo. Para planificar su consultorio y cotizar con nuestra asesora la Optómetra Eli Verdy, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(cp-266|cp266|caja de pruebas|lentillas|set de pruebas)/)) {
          return "La Caja de Pruebas CP-266 incluye un set profesional de 266 lentillas en vidrio óptico, con esferas, cilindros, prismas y accesorios. Para consultar disponibilidad y cotización, haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(remodelacion|construccion|laura|herrera|arquitecta|diseño|espacios)/)) {
          return "Nuestros servicios de diseño, construcción y adecuación de ópticas están a cargo de la Arquitecta Laura Herrera. Para planificar su nuevo espacio comercial, haz clic aquí para contactarte directamente 👤 +593 99 033 1482.";
        }
        if (query.match(/(capacitacion|entrenamiento|personal|uso de equipos|manejo|julieta|siguencia|doctora|oftalmologa)/)) {
          return "Garantizamos el rendimiento de su inversión entrenando de forma técnica y continua a su personal con la Dra. Oftalmóloga Julieta Siguencia. Para agendar una sesión, haz clic aquí para contactarte directamente 👤 +593 95 895 1408.";
        }
        if (query.match(/(posventa|garantia|stock|soporte|repuestos|mantenimiento|alexander|jacome|licenciado)/)) {
          return "El servicio posventa, las consultas de garantía y el soporte son coordinados por el Licenciado Alexander Jácome. Para solicitar asistencia directa, haz clic aquí para contactarte 👤 +593 98 765 4320.";
        }
        if (query.match(/(precio|cotizacion|cuanto cuesta|comprar|pago|credito|costo|oferta|eli|verdy)/)) {
          return "Estaremos gustosos de enviarle una cotización formal. Por favor, comunícate con nuestra asesora la Optómetra Eli Verdy: haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(mision|vision|valores|proposito|cultura|quienes somos|empresa)/)) {
          return "En VERSIOR IMPORT'S impulsamos el crecimiento de los profesionales de la salud visual. Para coordinar una cotización general de nuestros equipos, comunícate con nuestra asesora la Optómetra Eli Verdy: haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
        }
        if (query.match(/(prototipo|maqueta|diseño de optica|modelo de optica|proyecto)/)) {
          return "¡Por supuesto! Si desea coordinar y visualizar el prototipo y modelado ergonómico de su óptica, comunícate con la Arquitecta Laura Herrera: haz clic aquí para contactarte directamente 👤 +593 99 033 1482.";
        }
        if (query.match(/(manual basico|enfermedades|manual de enfermedades|patologias)/)) {
          return "Disponemos de un completo Manual Básico de enfermedades y patologías visuales desarrollado por la Dra. Oftalmóloga Julieta Siguencia. Solicítaselo aquí: haz clic aquí para contactarte directamente 👤 +593 95 895 1408.";
        }
        return "Como asistente clínico especializado de VERSIOR IMPORT'S, estoy aquí para guiarle. Si desea cotizar equipos, comunícate con la Optómetra Eli Verdy: haz clic aquí para contactarte directamente 👤 +593 96 322 3843.";
      };

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = input;
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setIsLoading(true);

        setTimeout(() => {
          const aiResponse = getLocalAIResponse(userMsg);
          setMessages(prev => [...prev, { role: 'model', text: aiResponse }]);
          setIsLoading(false);
        }, 750);
      };

      return html`
        <div>
          <button 
            onClick=${() => setIsOpen(!isOpen)} 
            class="fixed bottom-6 right-6 w-16 h-16 rounded-full flex items-center justify-center text-white shadow-[0_8px_30px_rgba(6,85,129,0.3)] cursor-pointer transition-all duration-300 z-[100] ${isOpen ? 'bg-red-500 hover:bg-red-600 rotate-90' : 'bg-[#1FB4FA] hover:bg-[#0ea5e9] hover:scale-110'}"
          >
            ${isOpen ? html`<${X} size=${28} />` : html`<${MessageCircle} size=${28} />`}
          </button>
          
          ${isOpen && html`
            <div class="fixed bottom-28 right-6 w-[90vw] sm:w-96 bg-white rounded-3xl shadow-[0_20px_50px_rgba(6,85,129,0.2)] z-[100] overflow-hidden flex flex-col border border-gray-100 h-[500px] max-h-[75vh] animate-fade-in-up">
              <div class="bg-[#065581] p-4 text-white flex justify-between items-center relative overflow-hidden">
                <div class="absolute top-[-50%] right-[-10%] w-32 h-32 rounded-full bg-[#1FB4FA] blur-[40px] opacity-40"></div>
                <div class="relative z-10 flex items-center gap-3">
                  <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                    <${MessageCircle} size=${20} class="text-[#1FB4FA]" />
                  </div>
                  <div>
                    <h3 class="font-bold text-sm tracking-wide">Asistente VERSIOR</h3>
                    <p class="text-[10px] text-white/70 flex items-center gap-1.5 font-medium tracking-wider uppercase mt-0.5">
                      <span class="w-2.5 h-2.5 rounded-full bg-[#25D366] animate-pulse"></span> En línea
                    </p>
                  </div>
                </div>
              </div>
              
              <div class="flex-grow overflow-y-auto p-5 space-y-4 bg-gray-50/50">
                ${messages.map((m, i) => html`
                  <div key=${i} class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="p-3.5 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-sm ${m.role === 'user' ? 'bg-[#1FB4FA] text-white rounded-tr-none' : 'bg-white text-[#065581] rounded-tl-none border border-gray-100 font-medium'}">
                      ${renderChatMessage(m.text)}
                    </div>
                  </div>
                `)}
                ${isLoading && html`
                  <div class="flex justify-start animate-fade-in">
                    <div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none flex gap-1.5 items-center shadow-sm">
                      <div class="w-2 h-2 bg-[#1FB4FA]/40 rounded-full animate-bounce"></div>
                      <div class="w-2 h-2 bg-[#1FB4FA]/70 rounded-full animate-bounce delay-100"></div>
                      <div class="w-2 h-2 bg-[#1FB4FA] rounded-full animate-bounce delay-200"></div>
                    </div>
                  </div>
                `}
                <div ref=${messagesEndRef} />
              </div>
              
              <div class="p-4 bg-white border-t border-gray-100">
                <form onSubmit=${(e) => { e.preventDefault(); handleSend(); }} class="flex gap-2">
                  <input 
                    type="text" 
                    value=${input} 
                    onInput=${e => setInput(e.target.value)} 
                    placeholder="Consulte a nuestro asistente..." 
                    class="flex-grow bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1FB4FA]/50 focus:border-[#1FB4FA] text-sm text-[#065581] placeholder-gray-400 transition-all" 
                  />
                  <button 
                    type="submit" 
                    disabled=${isLoading || !input.trim()} 
                    class="bg-[#065581] text-white p-3 rounded-xl hover:bg-[#1FB4FA] transition-colors disabled:opacity-50 disabled:hover:bg-[#065581] shadow-md"
                  >
                    <${Send} size=${20} />
                  </button>
                </form>
              </div>
            </div>
          `}
        </div>
      `;
    };

    function App() {
      const validTabs = ['nosotros', 'productos', 'servicios', 'contacto', 'privacidad'];
      const getTabFromLocation = () => {
        const requestedTab = new URLSearchParams(window.location.search).get('tab');
        if (window.location.hash === '#privacidad') return 'privacidad';
        return validTabs.includes(requestedTab) ? requestedTab : 'nosotros';
      };

      const [activeTab, setActiveTab] = useState(getTabFromLocation);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      const navigateTo = (tab, replace = false) => {
        if (!validTabs.includes(tab)) return;
        setActiveTab(tab);
        setIsMenuOpen(false);
        const url = new URL(window.location.href);
        url.hash = '';
        if (tab === 'nosotros') url.searchParams.delete('tab');
        else url.searchParams.set('tab', tab);
        window.history[replace ? 'replaceState' : 'pushState']({ tab }, '', url);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        const handlePopState = () => {
          setActiveTab(getTabFromLocation());
          window.scrollTo(0, 0);
        };
        window.addEventListener('scroll', handleScroll);
        window.addEventListener('popstate', handlePopState);
        handleScroll();
        return () => {
          window.removeEventListener('scroll', handleScroll);
          window.removeEventListener('popstate', handlePopState);
        };
      }, []);

      useEffect(() => {
        const pageTitles = {
          nosotros: "Equipos Optométricos en Ecuador | VERSIOR IMPORT'S",
          productos: "Catálogo de Equipos Clínicos | VERSIOR IMPORT'S",
          servicios: "Servicios para Ópticas | VERSIOR IMPORT'S",
          contacto: "Contacto y Cotizaciones | VERSIOR IMPORT'S",
          privacidad: "Política de Privacidad | VERSIOR IMPORT'S"
        };
        document.title = pageTitles[activeTab];
        trackEvent('virtual_page_view', { page_name: activeTab });
      }, [activeTab]);

      const tabs = [
        { id: 'nosotros', label: 'Inicio' },
        { id: 'productos', label: 'Equipos' },
        { id: 'servicios', label: 'Servicios' },
        { id: 'contacto', label: 'Contacto' }
      ];

      return html`
        <div class="min-h-screen bg-[#FDFDFD] font-sans selection:bg-[#065581] selection:text-white flex flex-col">
          
          <!-- NAVBAR -->
          <nav aria-label="Navegación principal" class="fixed w-full z-50 transition-all duration-300 ${scrolled ? 'glass-panel shadow-sm py-2.5' : 'bg-white/95 backdrop-blur-md py-3'}">
            <div class="max-w-7xl mx-auto px-6">
              <div class="flex justify-between items-center">
                
                <button aria-label="Ir al inicio" class="flex items-center cursor-pointer" onClick=${() => navigateTo('nosotros')}>
                  <img 
                    src="https://raw.githubusercontent.com/alexzanderj14/Vonces-y-memorias-de-Zambiza/main/Versior.png" 
                    alt="VERSIOR IMPORT'S Logo" 
                    class="h-11 md:h-12 w-auto object-contain drop-shadow-sm hover:scale-105 transition-transform duration-300"
                  />
                </button>

                <div class="hidden md:flex items-center space-x-2 bg-white/60 backdrop-blur-md px-2 py-1.5 rounded-full border border-gray-200/50 shadow-sm">
                  ${tabs.map((tab) => html`
                    <button
                      key=${tab.id}
                      onClick=${() => navigateTo(tab.id)}
                      aria-current=${activeTab === tab.id ? 'page' : undefined}
                      class="px-4 py-2 rounded-full text-sm font-bold transition-all duration-300 ${activeTab === tab.id ? 'bg-[#065581] text-white shadow-md' : 'text-gray-600 hover:text-[#065581] hover:bg-gray-100/70'}"
                    >
                      ${tab.label}
                    </button>
                  `)}
                </div>

                <div class="hidden md:flex items-center gap-3">
                  <a href="https://www.instagram.com/versiorimports/" aria-label="Instagram de VERSIOR" target="_blank" rel="noopener noreferrer" class="text-[#065581] hover:text-[#1FB4FA] transition-colors"><${Instagram} size=${22} /></a>
                  <a href=${buildWhatsAppLink("Hola VERSIOR IMPORT'S, quiero recibir información sobre sus equipos.")} target="_blank" rel="noopener noreferrer" onClick=${() => trackEvent('generate_lead', { source: 'navbar', channel: 'whatsapp' })} class="inline-flex items-center gap-2 bg-[#25D366] hover:bg-[#20ba5a] text-white px-5 py-2.5 rounded-xl text-sm font-black transition-colors shadow-sm">
                    <${MessageCircle} size=${18} /> Cotizar ahora
                  </a>
                </div>

                <button aria-label=${isMenuOpen ? 'Cerrar menú' : 'Abrir menú'} aria-expanded=${isMenuOpen} class="md:hidden text-[#065581] p-2" onClick=${() => setIsMenuOpen(!isMenuOpen)}>
                  ${isMenuOpen ? html`<${X} size=${28} />` : html`<${Menu} size=${28} />`}
                </button>
              </div>
            </div>

            ${isMenuOpen && html`
              <div class="md:hidden absolute top-full left-0 w-full bg-white border-t border-gray-100 shadow-xl animate-fade-in">
                <div class="flex flex-col p-4 space-y-2">
                  ${tabs.map((tab) => html`
                    <button
                      key=${tab.id}
                      onClick=${() => {
                        navigateTo(tab.id);
                      }}
                      class="p-4 rounded-xl text-left font-bold transition-colors ${activeTab === tab.id ? 'bg-[#f0f9ff] text-[#1FB4FA]' : 'text-gray-600 hover:bg-gray-50'}"
                    >
                      ${tab.label}
                    </button>
                  `)}
                  <a href=${buildWhatsAppLink("Hola VERSIOR IMPORT'S, quiero recibir información sobre sus equipos.")} target="_blank" rel="noopener noreferrer" onClick=${() => trackEvent('generate_lead', { source: 'mobile_menu', channel: 'whatsapp' })} class="mt-2 inline-flex items-center justify-center gap-2 bg-[#25D366] text-white p-4 rounded-xl font-black"><${MessageCircle} size=${19} /> Cotizar por WhatsApp</a>
                </div>
              </div>
            `}
          </nav>

          <!-- MAIN BODY -->
          <main class="flex-grow pt-20">
            ${activeTab === 'nosotros' && html`<${NosotrosView} setActiveTab=${navigateTo} />`}
            ${activeTab === 'productos' && html`<${ProductosView} setActiveTab=${navigateTo} />`}
            ${activeTab === 'servicios' && html`<${ServiciosView} setActiveTab=${navigateTo} />`}
            ${activeTab === 'contacto' && html`<${ContactoView} setActiveTab=${navigateTo} />`}
            ${activeTab === 'privacidad' && html`<${PrivacidadView} />`}
          </main>

          <!-- GLOBAL FOOTER -->
          <footer class="bg-[#065581] pt-16 pb-8 border-t-4 border-[#1FB4FA]">
            <div class="max-w-7xl mx-auto px-6">
              <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-8">
                
                <div class="flex flex-col items-center md:items-start mb-6 md:mb-0">
                  <button aria-label="Ir al inicio" class="flex items-center bg-white p-3 rounded-2xl shadow-lg cursor-pointer hover:scale-105 transition-transform duration-300 mb-4" onClick=${() => navigateTo('nosotros')}>
                    <img 
                      src="https://raw.githubusercontent.com/alexzanderj14/Vonces-y-memorias-de-Zambiza/main/Versior.png" 
                      alt="VERSIOR IMPORT'S Logo" 
                      class="h-10 md:h-12 w-auto object-contain"
                    />
                  </button>
                  <div class="text-white/80 space-y-1 text-center md:text-left text-xs md:text-sm leading-relaxed max-w-md">
                    <p class="flex items-start gap-2 justify-center md:justify-start">
                      <${MapPin} size=${16} class="text-[#1FB4FA] flex-shrink-0 mt-0.5" /> 
                      <span><strong>Quito:</strong> Pichincha, Quito - Calle Giovani Calles y Palermo, urbanización UTE</span>
                    </p>
                    <p class="flex items-start gap-2 justify-center md:justify-start">
                      <${MapPin} size=${16} class="text-[#1FB4FA] flex-shrink-0 mt-0.5" /> 
                      <span><strong>Biblián:</strong> Cañar, Biblián - Av. Mariscal Sucre y Benjamín Ochoa esquina</span>
                    </p>
                  </div>
                </div>
                
                <div class="flex flex-wrap justify-center gap-6 text-sm font-bold text-white/70">
                  <button onClick=${() => navigateTo('nosotros')} class="hover:text-white transition-colors">Inicio</button>
                  <a href="https://raw.githubusercontent.com/alexzanderj14/versior/main/CatalogoVersior_compressed.pdf" download="Catalogo_VERSIOR_2026.pdf" onClick=${() => trackEvent('file_download', { file_name: 'CatalogoVersior_compressed.pdf', source: 'footer' })} class="text-[#1FB4FA] hover:text-white transition-colors flex items-center gap-1"><${Download} size=${16} /> Descargar Catálogo</a>
                  <button onClick=${() => navigateTo('servicios')} class="hover:text-white transition-colors">Servicios</button>
                  <button onClick=${() => navigateTo('contacto')} class="hover:text-white transition-colors">Contacto</button>
                  <button onClick=${() => navigateTo('privacidad')} class="hover:text-white transition-colors flex items-center gap-1.5"><${FileText} size=${16} /> Política de Privacidad</button>
                </div>
              </div>
              
              <div class="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center text-xs font-semibold text-white/50">
                <p>&copy; ${new Date().getFullYear()} VERSIOR IMPORT'S. Todos los derechos reservados.</p>
                <p class="mt-2 md:mt-0">Importamos tecnología, entregamos confianza.</p>
              </div>
            </div>
          </footer>
          
          <${CookieBanner} openPrivacy=${() => navigateTo('privacidad')} />
          <${ChatWidget} />
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
