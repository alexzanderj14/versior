  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #FDFDFD;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    html { scroll-behavior: smooth; }
    .gtm-hidden { display: none; visibility: hidden; }

    button, a, input, select, textarea { outline-offset: 3px; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31, 180, 250, 0.45);
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes scroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-150px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes productSwap {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes productFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes carouselProgress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    
    .animate-fade-in-up {
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    .animate-slide-in-left {
      animation: slideInLeft 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .product-swap {
      animation: productSwap 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .product-float {
      animation: productFloat 4.5s ease-in-out infinite;
    }

    .carousel-progress {
      animation: carouselProgress 5s linear forwards;
      transform-origin: left;
    }

    .js [data-reveal] {
      opacity: 0;
      transform: translateY(34px);
      transition:
        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .js [data-reveal="left"] { transform: translateX(-40px); }
    .js [data-reveal="right"] { transform: translateX(40px); }
    .js [data-reveal="scale"] { transform: scale(0.94); }

    .js [data-reveal].is-visible {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }

    .reveal-grid > [data-reveal]:nth-child(2) { transition-delay: 80ms; }
    .reveal-grid > [data-reveal]:nth-child(3) { transition-delay: 160ms; }
    .reveal-grid > [data-reveal]:nth-child(4) { transition-delay: 240ms; }

    .zoom-stage img {
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }
    
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Carrusel de Marcas */
    .slider {
      background: #FDFDFD;
      height: 150px;
      margin: auto;
      overflow: hidden;
      position: relative;
      width: 100%;
    }
    .slider::before, .slider::after {
      background: linear-gradient(to right, rgba(253,253,253,1) 0%, rgba(255,255,255,0) 100%);
      content: "";
      height: 150px;
      position: absolute;
      width: 150px;
      z-index: 2;
    }
    .slider::after { right: 0; top: 0; transform: rotateZ(180deg); }
    .slider::before { left: 0; top: 0; }
    .slide-track {
      animation: scroll 35s linear infinite;
      display: flex;
      width: max-content;
      will-change: transform;
    }
    .slide {
      flex: 0 0 300px;
      height: 150px;
      width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }
    .slide img {
      max-width: 100%;
      max-height: 110px;
      object-fit: contain;
      filter: grayscale(100%) opacity(0.6);
      transition: all 0.4s ease;
      cursor: pointer;
    }
    .slide img:hover {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.15);
    }
    .slide img.logo-especial-grande {
      transform: scale(1.65) !important;
    }
    .slide img.logo-especial-grande:hover {
      transform: scale(1.85) !important;
      filter: grayscale(0%) opacity(1);
    }

    .hero-grid {
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 34px 34px;
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.02);
      transition:
        opacity 1.25s ease,
        transform 7s cubic-bezier(0.2, 0.65, 0.3, 1);
      will-change: opacity, transform;
    }

    .hero-photo.is-active {
      opacity: 1;
      transform: scale(1.085);
    }

    .hero-photo-overlay {
      background:
        linear-gradient(90deg, rgba(2, 33, 51, .94) 0%, rgba(3, 49, 74, .84) 42%, rgba(3, 45, 68, .58) 100%),
        linear-gradient(180deg, rgba(2, 32, 49, .18) 0%, rgba(2, 32, 49, .48) 100%);
    }

    .section-nav {
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #eef8fc 100%);
      border-top: 1px solid #dbeafe;
      padding: 2rem 1.5rem;
    }

    .section-nav__inner {
      align-items: center;
      display: flex;
      gap: 1.5rem;
      justify-content: space-between;
      margin: 0 auto;
      max-width: 80rem;
    }

    .section-nav__eyebrow {
      color: #0675a8;
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .1em;
      margin-bottom: .25rem;
      text-transform: uppercase;
    }

    .section-nav__title {
      color: #065581;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .section-nav__controls {
      display: grid;
      gap: .75rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: min(100%, 31rem);
    }

    .section-nav__button {
      align-items: center;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 1rem;
      color: #065581;
      display: flex;
      gap: .75rem;
      justify-content: center;
      min-height: 4rem;
      padding: .75rem 1rem;
      text-align: left;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .section-nav__button:not(:disabled):hover {
      border-color: #1fb4fa;
      box-shadow: 0 10px 25px rgba(6, 85, 129, .12);
      transform: translateY(-2px);
    }

    .section-nav__button--next {
      background: #065581;
      border-color: #065581;
      color: #fff;
    }

    .section-nav__button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }

    .section-nav__direction {
      display: block;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      opacity: .72;
      text-transform: uppercase;
    }

    .section-nav__label {
      display: block;
      font-size: .92rem;
      font-weight: 900;
    }

    @media (max-width: 767px) {
      .section-nav { padding: 1.5rem 1rem 1.75rem; }
      .section-nav__inner { align-items: stretch; flex-direction: column; gap: 1rem; }
      .section-nav__controls { min-width: 0; width: 100%; }
      .section-nav__button { min-height: 3.75rem; padding: .65rem .75rem; }
      .section-nav__label { font-size: .82rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .slide-track { animation: none; }
      .product-float, .carousel-progress { animation: none; }
      .hero-photo { transform: none !important; }
      .js [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
